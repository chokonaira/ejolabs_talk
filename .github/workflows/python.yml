name: Python demos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run offline lesson demos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check offline setup
        working-directory: code
        env:
          EJO_OFFLINE: "1"
        run: python setup_check.py

      - name: Compile scripts
        working-directory: code
        run: python -m compileall .

      - name: Run short demo flow
        working-directory: code
        env:
          EJO_OFFLINE: "1"
        run: python run_lesson.py quick --no-pause
